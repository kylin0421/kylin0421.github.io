<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网站编辑器</title>
  <style>
    :root{color-scheme:dark;--bg:#151719;--header:#1d1f20;--side:#1a1c1e;--field:#202326;--line:#393d40;--text:#f1f2f3;--muted:#b6babd;--quiet:#858b90;--accent:#36c6cd;--danger:#ff9890}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.masthead{height:72px;display:flex;align-items:center;gap:25px;padding:0 max(26px,calc((100vw - 1320px)/2));border-bottom:1px solid var(--line);background:var(--header)}.brand{min-width:250px;font-weight:750;font-size:20px}.site-nav{display:flex;align-self:stretch;align-items:center;gap:4px}.site-nav button{border:0;border-bottom:3px solid transparent;padding:24px 14px 20px;background:transparent;color:var(--muted);font:inherit;font-size:15px}.site-nav button:hover,.site-nav button.active{color:var(--text);border-color:var(--accent)}.local-note{margin-left:auto;color:var(--quiet);font-size:13px}.shell{display:grid;grid-template-columns:300px minmax(0,1fr);width:min(1320px,100%);min-height:calc(100vh - 72px);margin:auto}.profile{padding:46px 28px;border-right:1px solid var(--line);background:var(--side)}.avatar{width:150px;height:150px;object-fit:cover;border-radius:50%;border:4px solid #2f3336;background:#303438}.profile h3{margin:15px 0 6px;font-size:20px}.profile p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}.profile ul{margin:18px 0 25px;padding:0;list-style:none;color:var(--muted);font-size:14px}.profile li{padding:4px 0}.content{max-width:930px;padding:52px clamp(28px,6vw,86px) 80px}.heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px;padding-bottom:17px;border-bottom:1px solid var(--line)}.heading h1{margin:0;font-size:34px;letter-spacing:-.02em}.heading p{margin:0;color:var(--muted);font-size:14px}.editable{width:100%;border:1px solid transparent;border-radius:5px;padding:8px 9px;background:transparent;color:var(--text);font:inherit}.editable:hover{border-color:#50565a;background:#1b1e20}.editable:focus{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:1px;border-color:var(--accent);background:var(--field)}.label{display:block;margin:17px 0 5px;color:var(--muted);font-size:12px;font-weight:750;letter-spacing:.07em;text-transform:uppercase}.profile .editable{font-size:14px}.profile .name-input{font-size:20px;font-weight:700}.profile .bio-input{min-height:128px;resize:vertical}.button{border:1px solid var(--line);border-radius:5px;padding:9px 13px;background:#2b2f32;color:var(--text);font:650 14px inherit;cursor:pointer}.button:hover{background:#363b3f;border-color:#687075}.button.primary{background:var(--accent);border-color:var(--accent);color:#063538}.button.danger{border-color:#9b5752;background:#482724;color:#ffd7d3}.button.small{padding:6px 9px;font-size:12px}.rows{border-top:1px solid var(--line)}.post-row{width:100%;padding:21px 3px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);text-align:left;cursor:pointer}.post-row:hover h2{color:#71e2e7}.post-row h2{margin:0 0 5px;font-size:22px;line-height:1.35}.post-row p{overflow:hidden;margin:0;color:var(--muted);font-size:14px;text-overflow:ellipsis;white-space:nowrap}.post-row time{display:block;margin-bottom:5px;color:var(--quiet);font-size:13px}.title-input{margin:0 0 23px;padding:5px 8px;font-size:34px;font-weight:750;letter-spacing:-.025em}.metadata{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:18px}.body-input{min-height:460px;resize:vertical;font:16px/1.8 ui-monospace,SFMono-Regular,Consolas,"Microsoft YaHei",monospace}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:18px}.status{margin-right:auto;color:var(--muted);font-size:14px}.status.success{color:#75e8a9}.status.error{color:var(--danger)}.status.draft{color:#ffd985}.back{margin:0 0 14px;padding:0;border:0;background:transparent;color:#7de4e8;font:inherit;cursor:pointer}.back:hover{text-decoration:underline}.nav-row{display:grid;grid-template-columns:1fr 1.6fr auto;gap:10px;margin-bottom:10px}.empty{color:var(--muted)}@media(max-width:800px){.masthead{height:auto;min-height:64px;flex-wrap:wrap;gap:0;padding:10px 18px}.brand{min-width:0;flex:1}.local-note{display:none}.site-nav{order:3;width:100%;overflow:auto}.site-nav button{padding:12px 9px 9px;white-space:nowrap}.shell{display:block}.profile{padding:25px 20px;border-right:0;border-bottom:1px solid var(--line)}.profile-grid{display:grid;grid-template-columns:106px 1fr;gap:0 16px}.avatar{grid-row:span 5;width:104px;height:104px}.profile ul,.profile .save-profile{grid-column:1/-1}.content{padding:34px 20px}.heading h1,.title-input{font-size:29px}.metadata,.nav-row{grid-template-columns:1fr}.body-input{min-height:380px;font-size:15px}}
  </style>
</head>
<body>
  <header class="masthead"><div class="brand" id="brand"></div><nav class="site-nav" id="nav"></nav><span class="local-note">仅本机可见 · 保存即提交并推送</span></header>
  <div class="shell"><aside class="profile" id="profile"></aside><main class="content" id="content"></main></div>
  <script>
    const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
    const draftPrefix='kylin-site-editor-draft:'; let site,posts=[],view='posts',activePost=null,draftTimer;
    const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    const escape=(v)=>{const e=document.createElement('span');e.textContent=v||'';return e.innerHTML};
    async function api(url,options){const r=await fetch(url,options),data=await r.json();if(!r.ok)throw new Error([data.error,data.details].filter(Boolean).join('\n'));return data}
    function setStatus(message,type=''){const el=$('.status');if(el){el.textContent=message;el.className='status '+type}}
    function render(){renderNav();renderProfile();renderContent()}
    function renderNav(){const tabs=[...site.navigation.map(x=>({label:x.title,key:/about/i.test(x.title)?'about':/post|blog/i.test(x.title)?'posts':'settings'})),{label:'网站设置',key:'settings'}];$('#brand').textContent=site.profile.siteTitle;$('#nav').innerHTML=tabs.map(x=>`<button class="${view===x.key?'active':''}" data-view="${x.key}">${escape(x.label)}</button>`).join('');$$('#nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view))}
    function renderProfile(){const p=site.profile;$('#profile').innerHTML=`<div class="profile-grid"><img class="avatar" id="avatar-preview" src="${escape(p.avatar)}" alt="头像"><div><label class="label">网站标题</label><input class="editable" id="site-title" value="${escape(p.siteTitle)}"></div><div><label class="label">姓名</label><input class="editable name-input" id="profile-name" value="${escape(p.name)}"></div><div><label class="label">头像路径</label><input class="editable" id="profile-avatar" value="${escape(p.avatar)}"></div><div><label class="label">简介 / Intro</label><textarea class="editable bio-input" id="profile-bio">${escape(p.bio)}</textarea></div><ul><li>GitHub / Google Scholar / Email</li><li>导航可在“网站设置”中修改</li></ul><button class="button primary save-profile" id="save-profile">保存个人资料</button></div>`;$('#profile-avatar').oninput=e=>$('#avatar-preview').src=e.target.value;$('#save-profile').onclick=saveProfile}
    function heading(title,detail=''){return `<div class="heading"><div><h1>${title}</h1>${detail?`<p>${detail}</p>`:''}</div></div>`}
    function renderContent(){const main=$('#content');if(view==='about')main.innerHTML=aboutView();else if(view==='settings')main.innerHTML=settingsView();else if(view==='edit')main.innerHTML=postView();else main.innerHTML=postsView();bindContent()}
    function aboutView(){const a=site.about;return `${heading('About','与公开网站的 About 页面共用同一份内容')}<input class="editable title-input" id="about-title" value="${escape(a.title)}"><label class="label">正文（Markdown）</label><textarea class="editable body-input" id="about-body">${escape(a.body)}</textarea><div class="toolbar"><span class="status">编辑后点击保存发布。</span><button class="button primary" id="save-about">保存并发布 About</button></div>`}
    function postsView(){return `${heading('Posts','日记日期取自文章文件名')}<div class="toolbar" style="margin-top:-12px;margin-bottom:14px"><span class="status">选择文章即可直接编辑；草稿切换后不会丢失。</span><button class="button primary" id="new-post">＋ 新建日记</button></div><section class="rows">${posts.map(p=>`<button class="post-row" data-file="${escape(p.file)}"><time>${escape(p.diaryDate)}</time><h2>${escape(p.title)}</h2><p>${escape(p.preview||'尚未填写正文')}</p></button>`).join('')||'<p class="empty">还没有日记。</p>'}</section>`}
    function postView(){const p=activePost;return `<button class="back" id="back">← 返回文章列表</button><input class="editable title-input" id="post-title" value="${escape(p.title||'')}" placeholder="文章标题"><div class="metadata"><label><span class="label">日记日期${p.file?'（文件名）':''}</span><input class="editable" id="post-date" type="date" ${p.file?'readonly':''} value="${escape(p.diaryDate||today())}"></label><label><span class="label">分类（逗号分隔）</span><input class="editable" id="post-categories" value="${escape((p.categories||[]).join(', '))}"></label><label><span class="label">标签（逗号分隔）</span><input class="editable" id="post-tags" value="${escape((p.tags||[]).join(', '))}"></label></div><label class="label">正文（Markdown）</label><textarea class="editable body-input" id="post-body" placeholder="开始写你的日记…">${escape(p.body||'')}</textarea><div class="toolbar"><span class="status">未发布内容会自动保存在这台电脑上。</span>${p.file?'<button class="button danger" id="delete-post">删除日记</button>':''}<button class="button primary" id="save-post">保存并发布</button></div>`}
    function settingsView(){return `${heading('网站设置','修改实际网站顶部导航')}<p class="empty">导航变更会写入 <code>_data/navigation.yml</code>，保存后由 GitHub Pages 重新构建。</p><div id="nav-editor">${site.navigation.map((n,i)=>navRow(n,i)).join('')}</div><div class="toolbar"><span class="status">可新增、移除或修改导航项目。</span><button class="button" id="add-nav">＋ 添加导航</button><button class="button primary" id="save-nav">保存并发布导航</button></div>`}
    function navRow(n,i){return `<div class="nav-row" data-index="${i}"><input class="editable nav-title" value="${escape(n.title)}" placeholder="名称"><input class="editable nav-url" value="${escape(n.url)}" placeholder="链接，例如 /about/"><button class="button small remove-nav">移除</button></div>`}
    function bindContent(){if(view==='about'){['about-title','about-body'].forEach(id=>$('#'+id).oninput=()=>{site.about={title:$('#about-title').value,body:$('#about-body').value}});$('#save-about').onclick=saveAbout;return}if(view==='posts'){$('#new-post').onclick=()=>openPost({title:'',diaryDate:today(),categories:['Blog'],tags:['Casual'],body:''});$$('.post-row').forEach(b=>b.onclick=()=>openPost(posts.find(p=>p.file===b.dataset.file)));return}if(view==='edit'){$('#back').onclick=()=>switchView('posts');['post-title','post-date','post-categories','post-tags','post-body'].forEach(id=>$('#'+id).addEventListener('input',updatePost));$('#save-post').onclick=savePost;const d=$('#delete-post');if(d)d.onclick=deletePost;return}$('#add-nav').onclick=()=>{site.navigation.push({title:'New page',url:'/'});renderContent()};$$('.remove-nav').forEach(b=>b.onclick=()=>{site.navigation.splice(Number(b.closest('.nav-row').dataset.index),1);renderContent()});$('#save-nav').onclick=saveNavigation}
    function switchView(next){persistDraft();view=next;activePost=null;renderNav();renderContent()}
    function split(v){return v.split(',').map(x=>x.trim()).filter(Boolean)}function draftKey(file=activePost&&activePost.file){return draftPrefix+(file||'new')}function readDraft(file){try{return JSON.parse(localStorage.getItem(draftKey(file))||'null')}catch{return null}}function persistDraft(){clearTimeout(draftTimer);if(activePost)try{localStorage.setItem(draftKey(),JSON.stringify(activePost))}catch{}}
    async function openPost(post){persistDraft();try{const fullPost=post.file?await api('/api/posts/'+encodeURIComponent(post.file)):post;const draft=readDraft(fullPost.file);activePost={...fullPost,...(draft||{})};view='edit';renderNav();renderContent();if(draft)setStatus('已恢复尚未发布的本机草稿。','draft')}catch(error){setStatus('无法读取文章内容：'+error.message,'error')}}
    function updatePost(){activePost={...activePost,title:$('#post-title').value,diaryDate:$('#post-date').value,categories:split($('#post-categories').value),tags:split($('#post-tags').value),body:$('#post-body').value};clearTimeout(draftTimer);draftTimer=setTimeout(()=>{persistDraft();setStatus('草稿已自动保存在这台电脑上，尚未发布。','draft')},280)}
    async function saveProfile(){const profile={siteTitle:$('#site-title').value,name:$('#profile-name').value,avatar:$('#profile-avatar').value,bio:$('#profile-bio').value};setStatus('正在保存个人资料…');try{const d=await api('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(profile)});site.profile=profile;renderNav();setStatus(d.message,d.published?'success':'')}catch(e){setStatus(e.message,'error')}}
    async function saveAbout(){setStatus('正在保存 About 页面…');try{const d=await api('/api/about',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(site.about)});setStatus(d.message,d.published?'success':'')}catch(e){setStatus(e.message,'error')}}
    async function saveNavigation(){const items=$$('.nav-row').map(r=>({title:$('.nav-title',r).value,url:$('.nav-url',r).value}));setStatus('正在保存导航…');try{const d=await api('/api/navigation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items})});site.navigation=items.filter(x=>x.title.trim()&&x.url.trim());renderNav();setStatus(d.message,d.published?'success':'')}catch(e){setStatus(e.message,'error')}}
    async function savePost(){persistDraft();const key=draftKey();setStatus('正在保存、提交并推送…');try{const d=await api(activePost.file?'/api/posts/'+encodeURIComponent(activePost.file):'/api/posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(activePost)});localStorage.removeItem(key);activePost.file=d.file;posts=(await api('/api/posts')).posts;setStatus(d.message,d.published?'success':'')}catch(e){setStatus(e.message,'error')}}
    async function deletePost(){if(!confirm(`确定删除「${activePost.title||activePost.file}」吗？删除会立即提交并推送。`))return;setStatus('正在删除并推送…');try{const d=await api('/api/posts/'+encodeURIComponent(activePost.file),{method:'DELETE'});localStorage.removeItem(draftKey());posts=(await api('/api/posts')).posts;view='posts';activePost=null;renderNav();renderContent();setStatus(d.message,'success')}catch(e){setStatus(e.message,'error')}}
    async function init(){try{[site,{posts}]=await Promise.all([api('/api/site'),api('/api/posts')]);render()}catch(e){$('#content').innerHTML=`<p class="empty">编辑器无法启动：${escape(e.message)}</p>`}}init();
  </script>
</body>
</html>
