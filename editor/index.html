<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>博客编辑器</title>
  <style>
    :root { color-scheme:dark; --bg:#0b1117; --panel:#151d26; --panel-raised:#1c2732; --input:#101820; --line:#3a4856; --text:#f4f7fa; --muted:#bdc9d6; --subtle:#91a1b2; --accent:#79e2aa; --accent-ink:#062617; --danger:#ffb4ae; --focus:#9ee7ff; }
    * { box-sizing:border-box; } body { margin:0; font:17px/1.6 ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
    header { height:80px; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:0 32px; border-bottom:1px solid var(--line); background:linear-gradient(100deg,#101821,#0b1117); }
    h1 { font-size:24px; letter-spacing:.01em; margin:0; } .layout { display:grid; grid-template-columns:346px minmax(0,1fr); height:calc(100vh - 80px); }
    aside { border-right:1px solid var(--line); overflow:auto; padding:18px; background:#0d141b; } main { width:100%; padding:34px 40px; overflow:auto; } form { max-width:1120px; }
    button { min-height:44px; border:1px solid var(--line); border-radius:9px; padding:10px 16px; cursor:pointer; font:600 16px/1.2 inherit; background:var(--panel-raised); color:var(--text); transition:background .15s,border-color .15s,transform .15s; } button:hover { background:#26333f; border-color:#587083; } button:focus-visible,input:focus-visible,textarea:focus-visible { outline:3px solid color-mix(in srgb,var(--focus) 55%,transparent); outline-offset:2px; } button.primary { min-width:132px; background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:750; } button.primary:hover { background:#9bf0c1; border-color:#9bf0c1; } button:disabled { opacity:.58; cursor:wait; }
    #new { width:100%; min-height:46px; margin-bottom:16px; } .post { width:100%; min-height:68px; text-align:left; margin:0 0 8px; padding:12px 13px; background:transparent; border:1px solid transparent; }
    .post:hover,.post.active { border-color:#506274; background:var(--panel); } .post.active { box-shadow:inset 3px 0 0 var(--accent); } .post strong,.post small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .post strong { font-size:16px; line-height:1.4; } .post small { color:var(--muted); margin-top:5px; font-size:14px; line-height:1.4; }
    .fields { display:grid; grid-template-columns:minmax(0,1.7fr) minmax(240px,1fr); gap:20px; } label { display:block; color:var(--text); font-size:15px; font-weight:650; letter-spacing:.01em; margin:0 0 18px; } input,textarea { display:block; width:100%; margin-top:7px; border:1px solid var(--line); border-radius:9px; padding:12px 14px; background:var(--input); color:var(--text); font:400 17px/1.5 inherit; box-shadow:inset 0 1px 0 rgb(255 255 255 / 3%); } input { min-height:48px; } input[readonly] { color:#d0d9e3; background:#131b24; } input::placeholder,textarea::placeholder { color:var(--subtle); opacity:1; } textarea { min-height:52vh; resize:vertical; line-height:1.72; }
    .actions { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-top:20px; padding-top:18px; border-top:1px solid var(--line); } #status { color:var(--muted); min-height:24px; font-size:15px; } #status.error { color:var(--danger); } #status.success { color:var(--accent); font-weight:600; } #status.draft { color:#ffd68a; }
    .hint { color:var(--muted); font-size:14px; } @media (max-width:720px) { body { font-size:16px; } header { height:auto; min-height:70px; align-items:flex-start; flex-direction:column; gap:4px; padding:14px 18px; } h1 { font-size:21px; } .layout { grid-template-columns:1fr; height:auto; } aside { border-right:0; border-bottom:1px solid var(--line); max-height:34vh; padding:14px; } main { padding:24px 18px; } .fields { grid-template-columns:1fr; gap:0; } .actions { align-items:stretch; flex-direction:column; } button.primary { width:100%; } .hint { font-size:13px; } }
  </style>
</head>
<body>
  <header><h1>博客编辑器</h1><span class="hint">仅在这台电脑上运行 · Ctrl/⌘ + S 保存并发布</span></header>
  <div class="layout"><aside><button id="new">＋ 新建文章</button><div id="posts"></div></aside>
  <main><form id="editor">
    <div class="fields"><label>标题<input id="title" required placeholder="文章标题"></label><label>日记日期（新文章可修改）<input id="date" type="date" required></label></div>
    <div class="fields"><label>分类（逗号分隔）<input id="categories" value="Blog"></label><label>标签（逗号分隔）<input id="tags" value="Casual"></label></div>
    <label>正文（Markdown）<textarea id="body" placeholder="从这里开始写…"></textarea></label>
    <div class="actions"><span id="status">选择一篇文章，或新建一篇。</span><button class="primary" id="publish" type="submit">保存并发布</button></div>
  </form></main></div>
  <script>
    const $ = (id) => document.getElementById(id); const draftPrefix = 'kylin-blog-editor-draft:'; let currentFile = null; let draftTimer = null;
    const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
    function setStatus(text, type='') { const el=$('status'); el.textContent=text; el.className=type; }
    function split(value) { return value.split(',').map(s=>s.trim()).filter(Boolean); }
    function draftKey(file=currentFile) { return draftPrefix+(file||'new'); }
    function formPost() { return {title:$('title').value,diaryDate:$('date').value,categories:split($('categories').value),tags:split($('tags').value),body:$('body').value}; }
    function readDraft(file=currentFile) { try { const draft=JSON.parse(localStorage.getItem(draftKey(file))||'null'); return draft&&typeof draft==='object'?draft:null; } catch { return null; } }
    function saveDraft() { clearTimeout(draftTimer); const post=formPost(); if (!currentFile&&!post.title&&!post.body) return; try { localStorage.setItem(draftKey(),JSON.stringify(post)); setStatus('草稿已自动保存在这台电脑上，尚未发布。','draft'); } catch { setStatus('无法保存本机草稿；请尽快发布或复制内容。','error'); } }
    function scheduleDraft() { clearTimeout(draftTimer); draftTimer=setTimeout(saveDraft,300); }
    function clearDraft(key) { try { localStorage.removeItem(key); } catch {} }
    function fill(post) { currentFile=post.file||null; const draft=readDraft(); const values=draft||post; $('title').value=values.title||''; $('date').value=values.diaryDate||today(); $('date').readOnly=Boolean(currentFile); $('categories').value=(values.categories||['Blog']).join(', '); $('tags').value=(values.tags||['Casual']).join(', '); $('body').value=values.body||''; setStatus(draft ? '已恢复尚未发布的本机草稿。' : currentFile ? `正在编辑：${currentFile}（日记日期由文件名确定）` : '新文章将自动生成文件名。', draft?'draft':''); }
    async function request(url, options) { const response=await fetch(url, options); const data=await response.json(); if(!response.ok) throw new Error([data.error,data.details].filter(Boolean).join('\n')); return data; }
    async function loadList(selected) { const {posts}=await request('/api/posts'); $('posts').innerHTML=''; for(const post of posts) { const button=document.createElement('button'); button.className='post'+(post.file===selected?' active':''); button.innerHTML=`<strong>${post.title}</strong><small>${post.diaryDate||post.file} · ${post.preview||'空文章'}</small>`; button.onclick=async()=>{ saveDraft(); try { fill(await request('/api/posts/'+encodeURIComponent(post.file))); await loadList(post.file); } catch(e) { setStatus(e.message,'error'); } }; $('posts').append(button); } }
    $('new').onclick=()=>{ saveDraft(); fill({diaryDate:today(),categories:['Blog'],tags:['Casual'],body:''}); };
    ['title','date','categories','tags','body'].forEach((id)=>$(id).addEventListener('input',scheduleDraft));
    $('editor').onsubmit=async(e)=>{ e.preventDefault(); const button=$('publish'); const savedDraftKey=draftKey(); const post=formPost(); button.disabled=true; setStatus('正在保存、提交并推送…'); try { const url=currentFile?'/api/posts/'+encodeURIComponent(currentFile):'/api/posts'; const data=await request(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(post)}); clearDraft(savedDraftKey); currentFile=data.file; $('date').value=post.diaryDate; $('date').readOnly=true; setStatus('已保存、提交并推送。','success'); await loadList(currentFile); } catch(e) { setStatus(e.message,'error'); } finally { button.disabled=false; } };
    window.addEventListener('keydown',(e)=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault(); $('editor').requestSubmit();} });
    loadList().catch(e=>setStatus(e.message,'error'));
  </script>
</body>
</html>
