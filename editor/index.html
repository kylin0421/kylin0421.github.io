<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>博客编辑器</title>
  <style>
    :root { color-scheme: dark; --bg:#101315; --panel:#191e22; --line:#303a40; --text:#eef3f3; --muted:#9ba8aa; --accent:#77d6a4; --danger:#ff9c98; }
    * { box-sizing:border-box; } body { margin:0; font:15px/1.5 ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
    header { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; border-bottom:1px solid var(--line); }
    h1 { font-size:18px; margin:0; } .layout { display:grid; grid-template-columns:310px minmax(0,1fr); height:calc(100vh - 64px); }
    aside { border-right:1px solid var(--line); overflow:auto; padding:15px; } main { max-width:1050px; width:100%; margin:auto; padding:26px; overflow:auto; }
    button { border:0; border-radius:7px; padding:9px 13px; cursor:pointer; font:inherit; background:#2a3338; color:var(--text); } button.primary { background:var(--accent); color:#0c2418; font-weight:700; } button:disabled { opacity:.55; cursor:wait; }
    #new { width:100%; margin-bottom:12px; } .post { width:100%; text-align:left; margin:0 0 7px; padding:11px; background:transparent; border:1px solid transparent; }
    .post:hover,.post.active { border-color:var(--line); background:var(--panel); } .post strong,.post small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .post small { color:var(--muted); margin-top:3px; font-size:12px; }
    .fields { display:grid; grid-template-columns:2fr 1fr; gap:14px; } label { display:block; color:var(--muted); font-size:13px; margin:0 0 14px; } input,textarea { display:block; width:100%; margin-top:5px; border:1px solid var(--line); border-radius:7px; padding:10px; background:var(--panel); color:var(--text); font:inherit; } textarea { min-height:52vh; resize:vertical; line-height:1.65; }
    .actions { display:flex; align-items:center; justify-content:space-between; gap:15px; margin-top:14px; } #status { color:var(--muted); min-height:22px; } #status.error { color:var(--danger); } #status.success { color:var(--accent); }
    .hint { color:var(--muted); font-size:12px; } @media (max-width:720px) { .layout { grid-template-columns:1fr; height:auto; } aside { border-right:0; border-bottom:1px solid var(--line); max-height:32vh; } main { padding:18px; } .fields { grid-template-columns:1fr; } header { padding:0 16px; } }
  </style>
</head>
<body>
  <header><h1>博客编辑器</h1><span class="hint">仅在这台电脑上运行 · Ctrl/⌘ + S 保存并发布</span></header>
  <div class="layout"><aside><button id="new">＋ 新建文章</button><div id="posts"></div></aside>
  <main><form id="editor">
    <div class="fields"><label>标题<input id="title" required placeholder="文章标题"></label><label>最后修改日期（保存时自动更新）<input id="date" type="date" required readonly></label></div>
    <div class="fields"><label>分类（逗号分隔）<input id="categories" value="Blog"></label><label>标签（逗号分隔）<input id="tags" value="Casual"></label></div>
    <label>正文（Markdown）<textarea id="body" placeholder="从这里开始写…"></textarea></label>
    <div class="actions"><span id="status">选择一篇文章，或新建一篇。</span><button class="primary" id="publish" type="submit">保存并发布</button></div>
  </form></main></div>
  <script>
    const $ = (id) => document.getElementById(id); let currentFile = null;
    const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
    function setStatus(text, type='') { const el=$('status'); el.textContent=text; el.className=type; }
    function split(value) { return value.split(',').map(s=>s.trim()).filter(Boolean); }
    function fill(post) { currentFile=post.file||null; $('title').value=post.title||''; $('date').value=post.lastModifiedAt||today(); $('categories').value=(post.categories||['Blog']).join(', '); $('tags').value=(post.tags||['Casual']).join(', '); $('body').value=post.body||''; setStatus(currentFile ? `正在编辑：${currentFile}` : '新文章将自动生成文件名。'); }
    async function request(url, options) { const response=await fetch(url, options); const data=await response.json(); if(!response.ok) throw new Error([data.error,data.details].filter(Boolean).join('\n')); return data; }
    async function loadList(selected) { const {posts}=await request('/api/posts'); $('posts').innerHTML=''; for(const post of posts) { const button=document.createElement('button'); button.className='post'+(post.file===selected?' active':''); button.innerHTML=`<strong>${post.title}</strong><small>${post.lastModifiedAt||post.file} · ${post.preview||'空文章'}</small>`; button.onclick=async()=>{ try { fill(await request('/api/posts/'+encodeURIComponent(post.file))); await loadList(post.file); } catch(e) { setStatus(e.message,'error'); } }; $('posts').append(button); } }
    $('new').onclick=()=>fill({lastModifiedAt:today(),categories:['Blog'],tags:['Casual'],body:''});
    $('editor').onsubmit=async(e)=>{ e.preventDefault(); const button=$('publish'); button.disabled=true; setStatus('正在保存、提交并推送…'); try { const post={title:$('title').value,lastModifiedAt:today(),categories:split($('categories').value),tags:split($('tags').value),body:$('body').value}; const url=currentFile?'/api/posts/'+encodeURIComponent(currentFile):'/api/posts'; const data=await request(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(post)}); currentFile=data.file; $('date').value=today(); setStatus('已保存、提交并推送。','success'); await loadList(currentFile); } catch(e) { setStatus(e.message,'error'); } finally { button.disabled=false; } };
    window.addEventListener('keydown',(e)=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault(); $('editor').requestSubmit();} });
    loadList().catch(e=>setStatus(e.message,'error'));
  </script>
</body>
</html>
